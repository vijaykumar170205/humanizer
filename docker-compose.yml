version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: humanly_mongo
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=humanly_db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: humanly_api
    restart: always
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/humanly_db
      - JWT_SECRET=production_secret_key_humanly_2026_9988
      - AI_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CLIENT_URL=http://localhost

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: humanly_client
    restart: always
    ports:
      - '80:80'
    depends_on:
      - server

volumes:
  mongo_data:
